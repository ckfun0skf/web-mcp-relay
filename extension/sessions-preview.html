<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessions — UX Preview</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sessions-preview.css"></head><body><main><header><div><h1>Sessions</h1><p class="hint">UX preview · Demo data only · No live connections</p></div><button id="add" class="primary">Add demo session</button></header><div class="filters"><input id="search" type="search" aria-label="Search sessions" placeholder="Search agent or website"><select id="filter" aria-label="Session status"><option value="all">All sessions</option><option value="connected">Connected</option><option value="paused">Paused</option><option value="disconnected">Disconnected</option></select></div><p id="feedback" role="status"></p><div id="groups"></div><footer class="micro-footer"><span>No automatic session expiry</span><button id="end-all" class="danger">End all demo sessions</button></footer></main><script type="module" src="sessions-preview.js"></script></body></html>
