<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Management</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head><body data-view="manager"><main><header><h1>Sessions</h1><div class="row"><button id="settings">Relay settings</button><a href="hint-options.html" target="_blank" rel="noopener">Options</a></div></header><p id="notice" role="status"></p><section id="setup" class="card" hidden><h2>Relay settings</h2><label for="relay">Relay URL</label><input id="relay" type="url"><label for="owner">OWNER_SECRET</label><input id="owner" type="password" autocomplete="off" placeholder="Blank keeps this relay's saved secret"><div class="row"><button id="save" class="primary">Save</button><button id="cancel">Cancel</button></div><details><summary>Deploy or reset</summary><p class="hint">Use your own Worker with the same OWNER_SECRET and a base URL without /mcp.</p><button id="deploy">Copy secret &amp; deploy ↗</button><button id="reset" class="danger">Reset relay setup</button></details></section><section class="card"><h2>Add an agent session</h2><select id="target" aria-label="Target page"><option value="">Choose an accessible page</option></select><p id="page" class="hint"></p><div class="row"><button id="add" class="primary" disabled>Add Agent Session</button><button id="scan">Refresh page tools</button></div></section><div class="filters"><input id="search" type="search" aria-label="Search sessions" placeholder="Search agent or website"><select id="filter" aria-label="Status"><option value="all">All sessions</option><option value="connected">Connected</option><option value="paused">Paused</option><option value="disconnected">Disconnected</option></select></div><p id="summary" class="hint"></p><div id="sessions"></div><button id="end-all" class="danger" hidden>End all sessions</button><footer class="micro-footer"><span>Labels identify sessions, not verified agent identities.</span><a href="connector-help.html" target="_blank" rel="noopener">Connector setup ↗</a></footer></main><script type="module" src="workspace.js"></script></body></html>
